name: 🎙️ Generate Voiceover

on:
  push:
    paths:
      - "script.txt"
  workflow_dispatch:

jobs:
  generate-voice:
    name: Run Google Neural2 TTS Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            soundfile==0.12.1 \
            scipy==1.13.1 \
            numpy==1.26.4 \
            pydub==0.25.1 \
            requests

      - name: 📄 Verify script.txt
        run: |
          if [ ! -f "script.txt" ]; then
            echo "❌ ERROR: script.txt not found in repo root."
            exit 1
          fi
          echo "✅ script.txt found ($(wc -c < script.txt) bytes)"
          echo "--- Preview (first 5 lines) ---"
          head -5 script.txt

      - name: 🎙️ Generate voiceover audio
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python generate_voice.py

      - name: ✅ Verify output file
        run: |
          if [ ! -f "output_voice.wav" ]; then
            echo "❌ ERROR: output_voice.wav was not created."
            exit 1
          fi
          SIZE=$(wc -c < output_voice.wav)
          echo "✅ output_voice.wav created (${SIZE} bytes)"
          ffmpeg -i output_voice.wav 2>&1 | grep -E "Duration|Audio" || true

      - name: 📤 Upload voiceover as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-${{ github.sha }}
          path: output_voice.wav
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Write job summary
        if: success()
        run: |
          echo "## 🎙️ Voiceover Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Voice | en-GB-Neural2-B (Google Neural2) |" >> $GITHUB_STEP_SUMMARY
          echo "| Pitch | -2.0 semitones (deep mature sound) |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Duration | 60 seconds (hard cap) |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | output_voice.wav (24-bit / 24kHz) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ Download the audio from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
