name: 🎙️ Generate Voiceover

on:
  push:
    paths:
      - "script.txt"
      - "optimization-config.json"
  workflow_dispatch:

jobs:
  generate-voice:
    name: Run Edge TTS Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            edge-tts \
            soundfile==0.12.1 \
            scipy==1.13.1 \
            numpy==1.26.4 \
            pydub==0.25.1

      - name: 📄 Verify script.txt
        run: |
          if [ ! -f "script.txt" ]; then
            echo "❌ ERROR: script.txt not found."
            exit 1
          fi
          echo "✅ script.txt found ($(wc -c < script.txt) bytes)"
          echo "--- Preview ---"
          head -5 script.txt

      - name: 🧬 Load optimization config
        run: |
          python - <<'PYEOF'
          import json, os
          
          OPT = {
            "version": "default",
            "voice_settings": {
              "style": "deep_dramatic",
              "pace_wpm": 160,
              "emphasis_words": ["secret", "truth", "never", "dark", "manipulation"],
              "pause_after_hook": 0.5
            },
            "audio_effects": {
              "background_music_volume": 0.15,
              "whoosh_on_cut": True,
              "heartbeat_on_reveal": True,
              "heartbeat_volume": 0.3
            }
          }
          
          try:
            with open('optimization-config.json', 'r') as f:
              loaded = json.load(f)
              OPT.update(loaded)
              print(f"✅ Using Gen {OPT['version']}")
          except Exception as e:
            print(f"⚠️ Using defaults: {e}")
          
          with open(os.environ.get('GITHUB_ENV', '/dev/null'), 'a') as env:
            env.write(f"OPT_VERSION={OPT['version']}\n")
            env.write(f"OPT_PACE_WPM={OPT['voice_settings']['pace_wpm']}\n")
            env.write(f"OPT_PAUSE_AFTER_HOOK={OPT['voice_settings']['pause_after_hook']}\n")
            env.write(f"OPT_MUSIC_VOLUME={OPT['audio_effects']['background_music_volume']}\n")
            env.write(f"OPT_HEARTBEAT_VOLUME={OPT['audio_effects']['heartbeat_volume']}\n")
          PYEOF

      - name: 🎙️ Generate voiceover audio
        env:
          OPT_VERSION: ${{ env.OPT_VERSION }}
          OPT_PACE_WPM: ${{ env.OPT_PACE_WPM }}
          OPT_PAUSE_AFTER_HOOK: ${{ env.OPT_PAUSE_AFTER_HOOK }}
          OPT_MUSIC_VOLUME: ${{ env.OPT_MUSIC_VOLUME }}
          OPT_HEARTBEAT_VOLUME: ${{ env.OPT_HEARTBEAT_VOLUME }}
        run: python generate_voice.py

      - name: ✅ Verify output file
        run: |
          if [ ! -f "output_voice.wav" ]; then
            echo "❌ ERROR: output_voice.wav was not created."
            exit 1
          fi
          SIZE=$(wc -c < output_voice.wav)
          echo "✅ output_voice.wav created (${SIZE} bytes)"
          ffmpeg -i output_voice.wav 2>&1 | grep -E "Duration|Audio" || true

      - name: 📤 Upload voiceover as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-${{ github.sha }}
          path: output_voice.wav
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Write job summary
        if: success()
        run: |
          echo "## 🎙️ Voiceover Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Config | ${{ env.OPT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Voice | en-GB-RyanNeural (Edge TTS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Pitch | -2Hz (deep mature sound) |" >> $GITHUB_STEP_SUMMARY
          echo "| Pace WPM | ${{ env.OPT_PACE_WPM }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Duration | 60 seconds (hard cap) |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | output_voice.wav (24-bit / 24kHz) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ Download from **Artifacts** above." >> $GITHUB_STEP_SUMMARY

